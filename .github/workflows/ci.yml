name: CI

# The repository had no build/test workflow: only pages.yml (a site deploy). A workspace that did
# not compile reached main because nothing ran cargo on push. This runs `just ci` — the same
# tiers AGENTS.md documents (warnings, clippy, test, e2e) — so CI and a contributor's laptop cannot drift.
# The tier definitions live in the justfile, never duplicated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: warnings + test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # prost-build does not vendor protoc; without it the proto crate fails with NotFound.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No toolchain version here on purpose: rust-toolchain.toml pins it (and its components).
      # `rustup show` installs exactly that, so the pin has one home.
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Required, not cosmetic: build.rs only writes a placeholder index.html, and api_v1's
      # v1_surface_and_browser_lane asserts /repos.js and /repos.mjs are served 200. Also runs
      # oxlint --deny-warnings and tsc --noEmit, so the web gate is covered here too.
      - name: Build the SPA and the SDK
        run: just web-build

      - name: Compile cold workspace before timed checks
        timeout-minutes: 45
        run: cargo build --workspace --all-targets --locked
      - run: just warnings
      - run: just clippy
      - run: just test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
      - name: Compile cold E2E binary before timed tests
        timeout-minutes: 45
        run: cargo test -p walgit-server --test e2e --no-run --locked
      - run: just e2e

  container:
    name: release container
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: useblacksmith/setup-docker-builder@v1
      - name: Build release image without publishing
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          build-args: WALGIT_BUILD_SHA=${{ github.sha }}
          tags: walgithub:smoke
      - name: Start S3-compatible test store
        run: |
          docker compose up -d --wait rustfs
          docker compose run --rm create-bucket
      - name: Start packaged facade
        run: |
          docker run -d --name walgithub-smoke --network host \
            -e AWS_ACCESS_KEY_ID=walgit-dev \
            -e AWS_SECRET_ACCESS_KEY=walgit-dev-secret \
            -e WALGIT__STORE__BUCKET=walgit-test \
            -e WALGIT__STORE__S3__REGION=us-east-1 \
            -e WALGIT__STORE__S3__ENDPOINT=http://127.0.0.1:9000 \
            -e WALGIT__STORE__S3__FORCE_PATH_STYLE=true \
            -e WALGIT__SERVER__PUBLIC_URL=http://127.0.0.1:8097 \
            walgithub:smoke
      - name: Verify Git, PR webhooks, and persistence
        timeout-minutes: 5
        run: python3 scripts/container-smoke.py
      - name: Container logs
        if: failure()
        run: docker logs walgithub-smoke || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f walgithub-smoke || true
          docker compose down -v
