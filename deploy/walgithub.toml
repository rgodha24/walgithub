# Runtime defaults for WAL-Github: the Dockerfile with
#   --build-arg WALGIT_CONFIG_FILE=deploy/walgithub.toml --build-arg WALGIT_HTTP_PORT=8097
# (deploy/compose.yaml's `walgithub` service does this). The deployment supplies the bucket, region and
# public origin (WALGIT__ overrides). Integrations are registered through the `_dev` API
# (docs/GITHUB.md §11).
[server]
listen = "0.0.0.0:8097"
auto_create_on_push = true

[server.auth]
mode = "none"

[server.tls]
mode = "off"

[bundles]
enabled = false
advertise = false

[github]
enabled = true
webhook_poll_interval = "1s"

[store]
backend = "s3"
prefix = ""

[store.s3]
# Let the AWS SDK choose its endpoint from the injected region.
endpoint = ""
force_path_style = false

[cache]
dir = "/var/lib/walgit"
max_bytes = "5GiB"

[telemetry]
log_format = "json"
log_filter = "info"
